<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERCORE STUDIOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Strict 2.39:1 Anamorphic Cinema Frame */
        #anamorphic-stage {
            position: relative;
            width: 100vw;
            height: min(100vh, calc(100vw / 2.39));
            min-height: 320px;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            background-color: #030304;
            overflow: hidden;
        }

        /* Primary Optical Render Canvas */
        #optical-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* Start Gate: Pure Black with 10px Wide-Tracked Prompt */
        #start-gate {
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .start-label {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 0.85em;
            padding-left: 0.85em;
            color: rgba(240, 239, 233, 0.42);
            text-transform: uppercase;
            transition: color 0.5s ease, letter-spacing 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #start-gate:hover .start-label {
            color: rgba(240, 239, 233, 0.88);
            letter-spacing: 0.92em;
        }

        /* End State: Subtle Replay Trigger */
        #replay-trigger {
            position: fixed;
            bottom: 28px;
            right: 36px;
            z-index: 50;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 10px;
            letter-spacing: 0.65em;
            color: #f0efe9;
            text-transform: uppercase;
            opacity: 0;
            pointer-events: none;
            cursor: pointer;
            transition: opacity 0.6s ease;
            padding: 8px;
        }

        #replay-trigger.active {
            opacity: 0.25;
            pointer-events: auto;
        }

        #replay-trigger.active:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div id="start-gate">
        <span class="start-label">CLICK TO BEGIN</span>
    </div>

    <!-- 2.39:1 ANAMORPHIC CINEMA VIEWPORT -->
    <main id="anamorphic-stage">
        <canvas id="optical-canvas"></canvas>
    </main>

    <!-- POST-SEQUENCE REPLAY TRIGGER -->
    <button id="replay-trigger" type="button">REPLAY</button>

    <script>
        /************************************************************************
         * 1. OPTICAL LENS, VOLUMETRIC SHADOW & PHOTOREALISTIC DUST ENGINE
         *    Modeled after FromSoftware / Playdead / Sony Santa Monica boot cards
         ************************************************************************/
        const stageEl = document.getElementById('anamorphic-stage');
        const mainCanvas = document.getElementById('optical-canvas');
        const ctx = mainCanvas.getContext('2d', { alpha: false });

        // Offscreen buffers for real-time directional light masking, volumetric ray casting & chromatic dispersion
        const textMaskCanvas = document.createElement('canvas');
        const textMaskCtx = textMaskCanvas.getContext('2d');

        const litTextCanvas = document.createElement('canvas');
        const litTextCtx = litTextCanvas.getContext('2d');

        const rayBufferCanvas = document.createElement('canvas');
        const rayBufferCtx = rayBufferCanvas.getContext('2d');

        // Pre-generated 35mm microscopic film grain tile for organic sensor texture
        const grainCanvas = document.createElement('canvas');
        grainCanvas.width = 180;
        grainCanvas.height = 180;
        const grainCtx = grainCanvas.getContext('2d');

        function populateFilmGrain() {
            const imgData = grainCtx.createImageData(180, 180);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const v = 118 + (Math.random() - 0.5) * 34;
                data[i] = v;
                data[i + 1] = v;
                data[i + 2] = v + 2;
                data[i + 3] = 10; // Ultra-subtle microscopic grain alpha
            }
            grainCtx.putImageData(imgData, 0, 0);
        }
        populateFilmGrain();

        let width = 1280;
        let height = 535;
        let dpr = 1;

        function resizePipeline() {
            const rect = stageEl.getBoundingClientRect();
            width = Math.max(1, Math.floor(rect.width));
            height = Math.max(1, Math.floor(rect.height));
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            mainCanvas.width = width * dpr;
            mainCanvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            textMaskCanvas.width = width * dpr;
            textMaskCanvas.height = height * dpr;
            textMaskCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            litTextCanvas.width = width * dpr;
            litTextCanvas.height = height * dpr;
            litTextCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Half-resolution volumetric buffer for silky optical scattering
            rayBufferCanvas.width = Math.max(1, Math.floor(width * 0.5));
            rayBufferCanvas.height = Math.max(1, Math.floor(height * 0.5));
            rayBufferCtx.setTransform(0.5, 0, 0, 0.5, 0, 0);
        }

        window.addEventListener('resize', resizePipeline);
        resizePipeline();

        // Ultra-sparse atmospheric dust motes — strictly visible ONLY inside the studio spotlight beam
        const DUST_COUNT = 52;
        const dustMotes = [];

        function createDustMote() {
            const depth = Math.random(); // 0 = near lens (bokeh blurred), 1 = focal plane (sharp)
            return {
                x: (Math.random() - 0.5) * 1.1, // normalized around center (-0.55 to 0.55)
                y: (Math.random() - 0.5) * 0.75,
                vx: (Math.random() - 0.42) * 0.00018,
                vy: -(0.00008 + Math.random() * 0.00022),
                size: depth < 0.18 ? 2.2 + Math.random() * 2.4 : 0.65 + Math.random() * 1.15,
                isBokeh: depth < 0.18,
                peakAlpha: depth < 0.18 ? 0.14 : 0.25 + Math.random() * 0.35,
                phase: Math.random() * Math.PI * 2,
                phaseSpeed: 0.012 + Math.random() * 0.02
            };
        }

        for (let i = 0; i < DUST_COUNT; i++) {
            dustMotes.push(createDustMote());
        }

        // Precision wide-tracked text helper on Canvas
        function drawTrackedText(targetCtx, text, centerX, centerY, trackingPx) {
            const chars = text.split('');
            let totalWidth = 0;
            const charWidths = [];

            for (let i = 0; i < chars.length; i++) {
                const w = targetCtx.measureText(chars[i]).width;
                charWidths.push(w);
                totalWidth += w;
            }
            totalWidth += trackingPx * (chars.length - 1);

            let currentX = centerX - totalWidth * 0.5;
            for (let i = 0; i < chars.length; i++) {
                const charCenter = currentX + charWidths[i] * 0.5;
                targetCtx.fillText(chars[i], charCenter, centerY);
                currentX += charWidths[i] + trackingPx;
            }
        }

        /************************************************************************
         * 2. AUTHENTIC AAA MINIMALIST AUDIO ENGINE (Web Audio API)
         *    PS4/PS5 & Blade Runner CS-80 Warm Fifth Swell + Glass Piano Note
         ************************************************************************/
        class AAAMinimalistAudioEngine {
            constructor() {
                this.ctx = null;
                this.convolver = null;
                this.masterGain = null;
            }

            init() {
                if (this.ctx) {
                    if (this.ctx.state === 'suspended') this.ctx.resume();
                    return;
                }
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();

                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.88;
                this.masterGain.connect(this.ctx.destination);

                // 5.2-Second Deep Dark-Hall Stereo Convolution Reverb
                const sr = this.ctx.sampleRate;
                const len = Math.floor(sr * 5.2);
                const impulse = this.ctx.createBuffer(2, len, sr);

                for (let ch = 0; ch < 2; ch++) {
                    const chData = impulse.getChannelData(ch);
                    let lpA = 0.0;
                    let lpB = 0.0;
                    for (let i = 0; i < len; i++) {
                        const t = i / sr;
                        const raw = Math.random() * 2 - 1;
                        // Two-pole warm damping so the reverb tail is velvety and dark
                        lpA += 0.11 * (raw - lpA);
                        lpB += 0.11 * (lpA - lpB);
                        const attackEnv = Math.sin(Math.min(1.0, t / 0.24) * Math.PI * 0.5);
                        const decayEnv = Math.exp(-t * 0.92);
                        chData[i] = lpB * attackEnv * decayEnv * 1.45;
                    }
                }

                this.convolver = this.ctx.createConvolver();
                this.convolver.buffer = impulse;

                const hallDamp = this.ctx.createBiquadFilter();
                hallDamp.type = 'lowpass';
                hallDamp.frequency.value = 1650;

                const reverbOut = this.ctx.createGain();
                reverbOut.gain.value = 0.78;

                this.convolver.connect(hallDamp);
                hallDamp.connect(reverbOut);
                reverbOut.connect(this.masterGain);
            }

            playBootSequenceScore() {
                this.init();
                const now = this.ctx.currentTime;

                // ==============================================================
                // CARD 1 (0.2s -> 6.2s): VELVETY CS-80 / PS5 WARM ANALOG PAD SWELL
                // Open fifth + major 7th/9th interval: C2, G2, D3, E3, B3
                // Routed through a 24dB dual-cascaded low-pass filter (180Hz -> 900Hz -> 160Hz)
                // ==============================================================
                const filterStage1 = this.ctx.createBiquadFilter();
                filterStage1.type = 'lowpass';
                filterStage1.Q.value = 0.707;

                const filterStage2 = this.ctx.createBiquadFilter();
                filterStage2.type = 'lowpass';
                filterStage2.Q.value = 0.707;

                // Filter opens smoothly as the studio light sweeps across "INTERCORE", then closes into black
                [filterStage1, filterStage2].forEach(f => {
                    f.frequency.setValueAtTime(170, now);
                    f.frequency.exponentialRampToValueAtTime(880, now + 3.15);
                    f.frequency.exponentialRampToValueAtTime(150, now + 6.1);
                });

                const padBusGain = this.ctx.createGain();
                padBusGain.gain.setValueAtTime(0.0001, now);
                padBusGain.gain.linearRampToValueAtTime(0.75, now + 2.1);
                padBusGain.gain.setValueAtTime(0.75, now + 3.8);
                padBusGain.gain.exponentialRampToValueAtTime(0.0001, now + 6.25);

                filterStage1.connect(filterStage2);
                filterStage2.connect(padBusGain);
                padBusGain.connect(this.masterGain);
                padBusGain.connect(this.convolver);

                const cs80Voices = [
                    { freq: 65.41,  detune:  0,   type: 'sine',     gain: 0.22, pan:  0.00 }, // C2 Deep Sub Foundation
                    { freq: 65.41,  detune:  5,   type: 'triangle', gain: 0.09, pan: -0.15 }, // C2 Warm Analog Body
                    { freq: 98.00,  detune: -4,   type: 'sine',     gain: 0.14, pan:  0.20 }, // G2 Open Fifth
                    { freq: 130.81, detune:  3,   type: 'triangle', gain: 0.10, pan: -0.30 }, // C3
                    { freq: 146.83, detune: -6,   type: 'sine',     gain: 0.08, pan:  0.35 }, // D3 (Suspended 9th)
                    { freq: 164.81, detune:  6,   type: 'triangle', gain: 0.065, pan: -0.42 }, // E3 (Warm 3rd)
                    { freq: 246.94, detune: -5,   type: 'sine',     gain: 0.055, pan:  0.42 }  // B3 (Crystalline Maj7)
                ];

                cs80Voices.forEach(v => {
                    const osc = this.ctx.createOscillator();
                    osc.type = v.type;
                    osc.frequency.setValueAtTime(v.freq, now + 0.1);
                    osc.detune.setValueAtTime(v.detune, now + 0.1);

                    const vGain = this.ctx.createGain();
                    vGain.gain.value = v.gain;

                    if (this.ctx.createStereoPanner) {
                        const panner = this.ctx.createStereoPanner();
                        panner.pan.setValueAtTime(v.pan, now);
                        osc.connect(vGain);
                        vGain.connect(panner);
                        panner.connect(filterStage1);
                    } else {
                        osc.connect(vGain);
                        vGain.connect(filterStage1);
                    }

                    osc.start(now + 0.1);
                    osc.stop(now + 6.35);
                });

                // ==============================================================
                // SUBTLE AIRY CRYSTALLINE HARMONIC AT PEAK LIGHT SWEEP (2.6s)
                // Very quiet, bathed in the 5-second dark stereo reverb tail
                // ==============================================================
                const shimmerOsc = this.ctx.createOscillator();
                shimmerOsc.type = 'sine';
                shimmerOsc.frequency.setValueAtTime(587.33, now + 2.35); // D5 pure overtone

                const shimmerOsc2 = this.ctx.createOscillator();
                shimmerOsc2.type = 'sine';
                shimmerOsc2.frequency.setValueAtTime(783.99, now + 2.55); // G5 airy fifth

                const shimmerGain = this.ctx.createGain();
                shimmerGain.gain.setValueAtTime(0.0001, now + 2.35);
                shimmerGain.gain.linearRampToValueAtTime(0.022, now + 3.25);
                shimmerGain.gain.exponentialRampToValueAtTime(0.0001, now + 6.0);

                shimmerOsc.connect(shimmerGain);
                shimmerOsc2.connect(shimmerGain);
                shimmerGain.connect(this.convolver);

                shimmerOsc.start(now + 2.35);
                shimmerOsc2.start(now + 2.55);
                shimmerOsc.stop(now + 6.1);
                shimmerOsc2.stop(now + 6.1);

                // ==============================================================
                // CARD 2 ("PRESENTS" at 6.85s): HAUNTING SUBMARINE / GLASS-PIANO RESONANT NOTE
                // Soft G4/D4 interval with delicate felt hammer transient & long dark decay
                // ==============================================================
                const noteStart = now + 6.88;

                const playGlassPianoVoice = (freq, peak, decayDur, panVal) => {
                    const mainOsc = this.ctx.createOscillator();
                    mainOsc.type = 'sine';
                    mainOsc.frequency.setValueAtTime(freq, noteStart);

                    // Soft 2nd harmonic that decays quickly like a real felt-damped piano string
                    const overtoneOsc = this.ctx.createOscillator();
                    overtoneOsc.type = 'sine';
                    overtoneOsc.frequency.setValueAtTime(freq * 2, noteStart);

                    const mainEnv = this.ctx.createGain();
                    mainEnv.gain.setValueAtTime(0.0001, noteStart);
                    mainEnv.gain.linearRampToValueAtTime(peak, noteStart + 0.045);
                    mainEnv.gain.exponentialRampToValueAtTime(0.0001, noteStart + decayDur);

                    const overtoneEnv = this.ctx.createGain();
                    overtoneEnv.gain.setValueAtTime(0.0001, noteStart);
                    overtoneEnv.gain.linearRampToValueAtTime(peak * 0.22, noteStart + 0.025);
                    overtoneEnv.gain.exponentialRampToValueAtTime(0.0001, noteStart + 0.75);

                    mainOsc.connect(mainEnv);
                    overtoneOsc.connect(overtoneEnv);

                    if (this.ctx.createStereoPanner) {
                        const panner = this.ctx.createStereoPanner();
                        panner.pan.setValueAtTime(panVal, noteStart);
                        mainEnv.connect(panner);
                        overtoneEnv.connect(panner);
                        panner.connect(this.convolver);
                        panner.connect(this.masterGain);
                    } else {
                        mainEnv.connect(this.convolver);
                        overtoneEnv.connect(this.convolver);
                        mainEnv.connect(this.masterGain);
                    }

                    mainOsc.start(noteStart);
                    overtoneOsc.start(noteStart);
                    mainOsc.stop(noteStart + decayDur + 0.05);
                    overtoneOsc.stop(noteStart + 0.85);
                };

                // G4 primary glass-piano note + quiet D4 submarine fifth underneath
                playGlassPianoVoice(392.00, 0.052, 3.6, -0.08); // G4
                playGlassPianoVoice(293.66, 0.028, 3.8,  0.10); // D4
                playGlassPianoVoice(98.00,  0.040, 3.4,  0.00); // G2 subtle submarine resonance
            }
        }

        const audioEngine = new AAAMinimalistAudioEngine();

        /************************************************************************
         * 3. SEQUENTIAL TWO-CARD FILM EDITING & OPTICAL RENDERING LOOP (10.5s)
         ************************************************************************/
        const startGate = document.getElementById('start-gate');
        const replayTrigger = document.getElementById('replay-trigger');

        const TOTAL_DURATION = 10.5; // seconds
        let startTime = null;
        let isPlaying = false;
        let fontsReady = false;

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                fontsReady = true;
            });
        } else {
            fontsReady = true;
        }

        function clamp01(v) {
            return Math.max(0, Math.min(1, v));
        }

        function smoothstep(edge0, edge1, x) {
            const t = clamp01((x - edge0) / (edge1 - edge0));
            return t * t * (3 - 2 * t);
        }

        function easeOutCubic(x) {
            const t = clamp01(x);
            return 1 - Math.pow(1 - t, 3);
        }

        function easeInOutSine(x) {
            const t = clamp01(x);
            return -(Math.cos(Math.PI * t) - 1) / 2;
        }

        /**
         * Renders Card 1 ("INTERCORE" + "S T U D I O") with:
         * - Physical point-light grazing across 3D letter faces
         * - Real-time volumetric shadow / light-bloom rays shifting direction opposite the light
         * - Prime lens optical rack focus & peripheral chromatic dispersion
         */
        function renderCard1(t) {
            const cx = width * 0.5;
            const cy = height * 0.485;

            // Card 1 master visibility window: 0.4s -> 6.0s
            const fadeIn = smoothstep(0.45, 1.75, t);
            const fadeOut = 1.0 - smoothstep(4.75, 5.95, t);
            const cardAlpha = fadeIn * fadeOut;
            if (cardAlpha <= 0.001) return;

            // Subtle physical camera push-in (1.0 -> 1.028 over 5.6 seconds)
            const camScale = 0.992 + 0.032 * easeInOutSine((t - 0.4) / 5.6);

            // Optical Rack Focus (Gaussian lens blur when entering & exiting)
            const enterBlur = (1.0 - easeOutCubic((t - 0.45) / 1.45)) * 11.0;
            const exitBlur = Math.pow(smoothstep(4.65, 5.95, t), 1.7) * 10.0;
            const rackFocusBlur = enterBlur + exitBlur;

            // Studio spotlight position sweeping from left to right across the dark room
            const sweepProgress = easeInOutSine((t - 0.5) / 5.2);
            const lightX = cx + (sweepProgress - 0.5) * (width * 0.68);
            const lightY = cy - height * 0.06 + Math.sin(sweepProgress * Math.PI) * (height * 0.02);
            const spotlightRadius = Math.max(width * 0.34, 340);

            // 1. Subtle Ambient Studio Room Illumination (only where the spotlight hits the dark back wall)
            const roomGlow = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, spotlightRadius * 1.15);
            const roomPeak = 0.055 * cardAlpha * Math.sin(sweepProgress * Math.PI);
            roomGlow.addColorStop(0, `rgba(235, 234, 228, ${roomPeak})`);
            roomGlow.addColorStop(0.5, `rgba(160, 162, 170, ${roomPeak * 0.35})`);
            roomGlow.addColorStop(1, 'rgba(3, 3, 4, 0)');
            ctx.fillStyle = roomGlow;
            ctx.fillRect(0, 0, width, height);

            // 2. Render crisp base typography into offscreen mask
            textMaskCtx.clearRect(0, 0, width, height);
            textMaskCtx.save();
            textMaskCtx.translate(cx, cy);
            textMaskCtx.scale(camScale, camScale);
            textMaskCtx.translate(-cx, -cy);

            const mainFontSize = Math.max(26, Math.min(width * 0.052, 66));
            const mainTracking = mainFontSize * 0.36;
            textMaskCtx.font = `600 ${mainFontSize}px 'Cinzel', serif`;
            textMaskCtx.textAlign = 'center';
            textMaskCtx.textBaseline = 'middle';
            textMaskCtx.fillStyle = '#ffffff';
            drawTrackedText(textMaskCtx, 'INTERCORE', cx, cy - mainFontSize * 0.14, mainTracking);

            // Tiny, wide-tracked "S T U D I O" underneath
            const subAlpha = smoothstep(1.15, 2.35, t) * (1.0 - smoothstep(4.65, 5.75, t));
            if (subAlpha > 0.005) {
                const subFontSize = Math.max(8.5, Math.min(width * 0.0085, 11.5));
                const subTracking = subFontSize * 1.38;
                textMaskCtx.font = `300 ${subFontSize}px 'Inter', sans-serif`;
                textMaskCtx.fillStyle = `rgba(240, 239, 233, ${subAlpha * 0.78})`;
                drawTrackedText(textMaskCtx, 'STUDIOS', cx, cy + mainFontSize * 0.72, subTracking);
            }
            textMaskCtx.restore();

            // 3. Apply Physical Directional Light Grazing to the Letter Faces
            litTextCtx.clearRect(0, 0, width, height);
            litTextCtx.drawImage(textMaskCanvas, 0, 0, width, height);

            litTextCtx.globalCompositeOperation = 'source-in';
            // Base unlit dark architectural slate (#16161a)
            litTextCtx.fillStyle = '#16161a';
            litTextCtx.fillRect(0, 0, width, height);

            // Moving Studio Spotlight Cone illuminating the letter faces to stark bone/platinum white (#f0efe9)
            const faceLightGrad = litTextCtx.createRadialGradient(
                lightX, lightY, 0,
                lightX, lightY, spotlightRadius * 0.88
            );
            faceLightGrad.addColorStop(0.0, '#ffffff');
            faceLightGrad.addColorStop(0.22, '#f0efe9');
            faceLightGrad.addColorStop(0.55, 'rgba(185, 186, 192, 0.58)');
            faceLightGrad.addColorStop(0.82, 'rgba(65, 66, 72, 0.22)');
            faceLightGrad.addColorStop(1.0, 'rgba(22, 22, 26, 0)');

            litTextCtx.globalCompositeOperation = 'source-atop';
            litTextCtx.fillStyle = faceLightGrad;
            litTextCtx.fillRect(0, 0, width, height);
            litTextCtx.globalCompositeOperation = 'source-over';

            // 4. Real-Time Dynamic Volumetric Shadow / Light Scatter Casting
            // As the point light moves left->right, volumetric scatter rays project away from (lightX, lightY)
            rayBufferCtx.clearRect(0, 0, width, height);
            const RAY_STEPS = 22;
            const rayVisibility = cardAlpha * Math.sin(sweepProgress * Math.PI) * 0.34;

            if (rayVisibility > 0.005) {
                for (let i = 1; i <= RAY_STEPS; i++) {
                    const p = i / RAY_STEPS;
                    // Radial expansion away from the moving light source
                    const scale = 1.0 + p * 0.095;
                    const stepAlpha = (1.0 - p) * (1.0 - p) * (rayVisibility / RAY_STEPS) * 2.6;

                    rayBufferCtx.save();
                    rayBufferCtx.translate(lightX, lightY);
                    rayBufferCtx.scale(scale, 1.0 + p * 0.045);
                    rayBufferCtx.translate(-lightX, -lightY);
                    rayBufferCtx.globalAlpha = stepAlpha;
                    rayBufferCtx.drawImage(litTextCanvas, 0, 0, width, height);
                    rayBufferCtx.restore();
                }

                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.filter = 'blur(7px)';
                ctx.globalAlpha = 0.85;
                ctx.drawImage(rayBufferCanvas, 0, 0, rayBufferCanvas.width, rayBufferCanvas.height, 0, 0, width, height);
                ctx.restore();
            }

            // 5. Render Atmospheric Dust Particles (ONLY visible where illuminated by the moving spotlight beam)
            renderSpotlightDust(lightX, lightY, spotlightRadius * 0.78, cardAlpha);

            // 6. Optical Rack Focus & Micro-Chromatic Dispersion Pass on Main Typography
            ctx.save();
            ctx.globalAlpha = cardAlpha;

            // Subtle RGB chromatic dispersion at the edges when out of focus or when light grazes edges
            const dispersionPx = 0.45 + (rackFocusBlur * 0.22);
            if (dispersionPx > 0.55) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.filter = `blur(${(rackFocusBlur * 1.05).toFixed(2)}px)`;
                ctx.globalAlpha = cardAlpha * 0.26;
                // Red/Warm edge fringe
                ctx.drawImage(litTextCanvas, -dispersionPx, 0, width, height);
                // Cool/Blue edge fringe
                ctx.drawImage(litTextCanvas, dispersionPx, 0, width, height);
                ctx.restore();
            }

            // Primary optical focal plane pass
            ctx.filter = rackFocusBlur > 0.12 ? `blur(${rackFocusBlur.toFixed(2)}px)` : 'none';
            ctx.drawImage(litTextCanvas, 0, 0, width, height);

            // Razor-sharp specular rim highlight pass (1px offset toward the light source)
            if (rackFocusBlur < 2.2) {
                const rimDirX = (lightX - cx) / (width * 0.5);
                ctx.globalCompositeOperation = 'screen';
                ctx.globalAlpha = cardAlpha * (1.0 - rackFocusBlur / 2.2) * 0.32;
                ctx.drawImage(litTextCanvas, rimDirX * 0.9, -0.5, width, height);
            }

            ctx.restore();
        }

        /**
         * Renders Card 2 ("P R E S E N T S") after a 0.85s beat of pure black silence:
         * - Small, wide-tracked, stark minimalist type in the dead center of the frame
         * - Subtle optical rack focus entrance and dissolve into darkness
         */
        function renderCard2(t) {
            // Beat of pure black silence from 6.0s -> 6.85s
            // Card 2 active from 6.85s -> 9.85s
            const fadeIn = smoothstep(6.85, 7.65, t);
            const fadeOut = 1.0 - smoothstep(8.85, 9.85, t);
            const alpha = fadeIn * fadeOut;
            if (alpha <= 0.001) return;

            const cx = width * 0.5;
            const cy = height * 0.5;

            // Optical prime lens focus pull
            const enterBlur = (1.0 - easeOutCubic((t - 6.85) / 0.85)) * 6.5;
            const exitBlur = Math.pow(smoothstep(8.8, 9.85, t), 1.6) * 7.5;
            const blurPx = enterBlur + exitBlur;

            // Imperceptible slow drift scale
            const scale = 0.994 + 0.016 * clamp01((t - 6.85) / 3.0);

            // Soft overhead cone of light illuminating "PRESENTS" and nearby dust motes
            const lightRadius = Math.max(width * 0.22, 220);
            renderSpotlightDust(cx, cy, lightRadius * 0.75, alpha * 0.75);

            litTextCtx.clearRect(0, 0, width, height);
            litTextCtx.save();
            litTextCtx.translate(cx, cy);
            litTextCtx.scale(scale, scale);
            litTextCtx.translate(-cx, -cy);

            const fontSize = Math.max(10.5, Math.min(width * 0.0115, 14.5));
            const tracking = fontSize * 1.25;
            litTextCtx.font = `300 ${fontSize}px 'Inter', sans-serif`;
            litTextCtx.textAlign = 'center';
            litTextCtx.textBaseline = 'middle';

            // Radial falloff across "PRESENTS" so center letters are stark #f0efe9 and outer edges fall off slightly
            const presGrad = litTextCtx.createRadialGradient(cx, cy, 0, cx, cy, lightRadius * 0.85);
            presGrad.addColorStop(0, '#f4f4f6');
            presGrad.addColorStop(0.65, '#dcdbd4');
            presGrad.addColorStop(1, 'rgba(130, 130, 138, 0.45)');
            litTextCtx.fillStyle = presGrad;

            drawTrackedText(litTextCtx, 'PRESENTS', cx, cy, tracking);
            litTextCtx.restore();

            ctx.save();
            ctx.globalAlpha = alpha * 0.92;
            ctx.filter = blurPx > 0.1 ? `blur(${blurPx.toFixed(2)}px)` : 'none';
            ctx.drawImage(litTextCanvas, 0, 0, width, height);
            ctx.restore();
        }

        /**
         * Updates and draws photorealistic atmospheric dust particles.
         * Particles are strictly invisible in the dark areas and ONLY catch light inside the active beam.
         */
        function renderSpotlightDust(lightX, lightY, beamRadius, masterAlpha) {
            if (masterAlpha <= 0.005) return;

            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            for (let i = 0; i < dustMotes.length; i++) {
                const m = dustMotes[i];
                m.phase += m.phaseSpeed;
                m.x += m.vx + Math.sin(m.phase) * 0.00006;
                m.y += m.vy;

                if (m.y < -0.45) m.y = 0.45;
                if (m.x > 0.58) m.x = -0.58;
                if (m.x < -0.58) m.x = 0.58;

                const px = width * 0.5 + m.x * width;
                const py = height * 0.5 + m.y * height;

                // Calculate physical distance to the studio spotlight beam center
                const dx = px - lightX;
                const dy = (py - lightY) * 1.45; // Elliptical anamorphic beam cone
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist >= beamRadius) continue; // Completely invisible outside the light beam

                // Smooth inverse-square light falloff inside the beam
                const normDist = dist / beamRadius;
                const beamIllumination = Math.pow(1.0 - normDist * normDist, 2.2);
                const twinkle = 0.72 + 0.28 * Math.sin(m.phase * 1.8);
                const finalAlpha = m.peakAlpha * beamIllumination * twinkle * masterAlpha;

                if (finalAlpha <= 0.004) continue;

                const grad = ctx.createRadialGradient(px, py, 0, px, py, m.size * 2.2);
                grad.addColorStop(0, `rgba(244, 244, 246, ${finalAlpha})`);
                grad.addColorStop(0.45, `rgba(220, 220, 226, ${finalAlpha * 0.45})`);
                grad.addColorStop(1, 'rgba(220, 220, 226, 0)');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(px, py, m.size * 2.2, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        /**
         * Applies subtle organic 35mm film grain & optical lens vignette
         */
        let grainFrameCounter = 0;
        let grainOffsetX = 0;
        let grainOffsetY = 0;

        function renderOpticalLensFinish() {
            // Update grain offset at ~24fps cadence for authentic cinema texture
            grainFrameCounter++;
            if (grainFrameCounter % 3 === 0) {
                grainOffsetX = Math.floor(Math.random() * 180);
                grainOffsetY = Math.floor(Math.random() * 180);
            }

            ctx.save();
            const pattern = ctx.createPattern(grainCanvas, 'repeat');
            if (pattern) {
                ctx.translate(grainOffsetX, grainOffsetY);
                ctx.fillStyle = pattern;
                ctx.fillRect(-grainOffsetX, -grainOffsetY, width, height);
            }
            ctx.restore();

            // Subtle optical prime-lens peripheral vignette
            const vigGrad = ctx.createRadialGradient(
                width * 0.5, height * 0.5, height * 0.28,
                width * 0.5, height * 0.5, Math.max(width * 0.58, height * 0.85)
            );
            vigGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
            vigGrad.addColorStop(0.75, 'rgba(0, 0, 0, 0.35)');
            vigGrad.addColorStop(1, 'rgba(0, 0, 0, 0.88)');

            ctx.fillStyle = vigGrad;
            ctx.fillRect(0, 0, width, height);
        }

        function masterRenderLoop(now) {
            // Absolute negative space base (#030304)
            ctx.fillStyle = '#030304';
            ctx.fillRect(0, 0, width, height);

            if (isPlaying && startTime !== null && fontsReady) {
                let elapsed = (now - startTime) / 1000;

                if (elapsed >= TOTAL_DURATION) {
                    elapsed = TOTAL_DURATION;
                    isPlaying = false;
                    replayTrigger.classList.add('active');
                }

                // Card 1: "INTERCORE" + "STUDIO" (0.4s -> 6.0s)
                if (elapsed >= 0.4 && elapsed <= 6.05) {
                    renderCard1(elapsed);
                }

                // Pure Black Silence Beat (6.05s -> 6.85s)

                // Card 2: "PRESENTS" (6.85s -> 9.9s)
                if (elapsed >= 6.8 && elapsed <= 9.95) {
                    renderCard2(elapsed);
                }
            }

            renderOpticalLensFinish();
            requestAnimationFrame(masterRenderLoop);
        }

        /************************************************************************
         * 4. BOOT SEQUENCE TRIGGERS
         ************************************************************************/
        function triggerSequence() {
            replayTrigger.classList.remove('active');
            startTime = performance.now();
            isPlaying = true;
            audioEngine.playBootSequenceScore();
        }

        startGate.addEventListener('click', () => {
            startGate.style.opacity = '0';
            startGate.style.pointerEvents = 'none';
            setTimeout(() => {
                startGate.style.display = 'none';
            }, 1100);
            triggerSequence();
        });

        replayTrigger.addEventListener('click', () => {
            triggerSequence();
        });

        window.onload = function () {
            resizePipeline();
            requestAnimationFrame(masterRenderLoop);
        };
    </script>
</body>
</html>
